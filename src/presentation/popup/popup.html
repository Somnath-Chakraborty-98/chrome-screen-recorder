<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RecordEasy</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="accountBar" class="account-bar"></div>

  <header>
    <h3>RecordEasy</h3>
    <span id="durationBadge" class="re-badge duration-badge">Free: 30 min</span>
  </header>

  <div id="meetingInfo" class="meeting-banner">
    <strong>📹 Meeting Detected:</strong>
    <span id="meetingType"></span>
  </div>

  <section class="options-section re-card meeting-cost-card">
    <div id="meetingCostSection" class="meeting-cost-section">
      <label class="checkbox-label">
        <input type="checkbox" id="meetingCostToggle" />
        Meeting Cost Calculator
        <a id="meetingCostLock" class="option-lock hidden" href="#" target="_blank" title="Plus/Pro feature">🔒</a>
      </label>
      <div id="hourlyRateBlock" class="hourly-rate-block hidden">
        <label class="re-label" for="hourlyRateInput">Hourly rate (₹)</label>
        <input class="re-input" id="hourlyRateInput" type="number" min="0" step="50" value="1500" disabled />
      </div>
    </div>
    <p id="setupSignInHint" class="setup-signin-hint hidden">Sign in to check all features</p>
  </section>

  <section class="options-section re-card quality-card">
    <span class="re-label">Quality</span>
    <div id="qualityOptions" class="quality-options-list"></div>
  </section>

  <section class="options-section">
    <label class="checkbox-label">
      <input type="checkbox" id="includeSystemAudio" />
      Include system audio (if available)
    </label>
    <label class="checkbox-label">
      <input type="checkbox" id="includeMic" checked />
      Include microphone
    </label>
  </section>

  <div class="timer-row">
    <span id="recordingTimer" class="recording-timer">00:00</span>
    <span id="recordingLimit" class="recording-limit"></span>
  </div>

  <div class="controls">
    <button id="startBtn" class="btn btn-primary">Start Recording</button>
    <button id="pauseBtn" class="btn btn-secondary" disabled>Pause</button>
    <button id="stopBtn" class="btn btn-secondary" disabled>Stop</button>
  </div>

  <div class="preview-container">
    <p class="preview-note">Preview is muted to avoid feedback.</p>
    <video id="preview" autoplay muted playsinline></video>
  </div>

  <div id="status" class="status-message">Ready.</div>
  <div id="settingsInstructions" class="settings-instructions"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
