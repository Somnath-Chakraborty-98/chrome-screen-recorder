<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="utf-8" />

  <title>RecordEasy — Download</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="../shared/theme.css" />

  <link rel="stylesheet" href="preview.css" />

</head>

<body>

  <div class="container">

    <header class="header">

      <div class="header-top">

        <div>

          <h1>Recording complete</h1>

          <p class="subtitle">Review, choose export options, and download</p>

        </div>

      </div>

      <div id="planBadge" class="plan-badge-row"></div>

    </header>



    <div class="video-container is-loading">
      <video id="recordedVideo" controls preload="auto" playsinline></video>
      <div id="videoLoading" class="video-loading">Loading recording…</div>
      <div id="watermarkOverlay" class="watermark-overlay hidden">RecordEasy</div>
    </div>



    <div class="info-bar">

      <div class="info-item">

        <span class="label">Duration</span>

        <span id="duration" class="value">--:--</span>

      </div>

      <div class="info-item">

        <span class="label">Size</span>

        <span id="fileSize" class="value">-- MB</span>

      </div>

      <div class="info-item">

        <span class="label">Recorded</span>

        <span id="recordedFormat" class="value">WebM</span>

      </div>

    </div>



    <section class="export-section re-card">

      <h2 class="section-title">Export options</h2>



      <div class="export-grid">

        <div class="export-group">

          <span class="export-group-label">Quality</span>

          <div id="qualityOptions" class="option-list"></div>

        </div>



        <div class="export-group">

          <span class="export-group-label">Format</span>

          <div id="formatOptions" class="option-list"></div>

        </div>

      </div>



      <div class="filename-block">

        <label class="re-label" for="filenameInput">File name</label>

        <div class="filename-row">

          <input id="filenameInput" class="re-input" type="text" />

          <button id="copyFilenameBtn" class="re-btn" type="button" title="Copy file name">📋</button>

          <a id="filenameLock" class="option-lock hidden" href="#" target="_blank" title="Plus/Pro feature">🔒</a>

        </div>

        <p id="filenameHint" class="option-hint"></p>

      </div>



      <div id="meetingCostSummary" class="meeting-cost-summary hidden"></div>

    </section>



    <div class="actions">

      <button id="downloadBtn" class="btn btn-primary">Download &amp; close</button>

      <button id="discardBtn" class="btn btn-danger">Discard</button>

      <button id="newRecordingBtn" class="btn btn-secondary">New recording</button>

    </div>



    <div id="statusMessage" class="status-message hidden"></div>

    <div id="exportProgress" class="export-progress hidden">

      <div class="export-progress-bar"><div id="exportProgressFill"></div></div>

      <span id="exportProgressText">Preparing export…</span>

    </div>

  </div>



  <script type="module" src="preview.js"></script>

</body>

</html>
